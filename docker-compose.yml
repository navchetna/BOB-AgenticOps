services:
  postgres:
    image: postgres:16-alpine
    container_name: bob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bob
      POSTGRES_PASSWORD: bob
      POSTGRES_DB: bob
    ports:
      # Published to the host (on 5434, since 5432 is often already taken)
      # so the backend can reach it whether it runs inside Docker (via the
      # `postgres` service name) or on the host (via localhost:5434).
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bob -d bob"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    container_name: bob-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bob:bob@postgres:5432/bob
      SECRET_KEY: change-me-to-a-random-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    container_name: bob-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
